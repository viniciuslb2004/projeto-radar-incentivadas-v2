name: Refresh editais FINEP (diário)

on:
  schedule:
    - cron: "0 8 * * *" # todo dia 08:00 UTC (05:00 horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar refresh dos editais FINEP
        working-directory: src
        run: python refresh_editais.py

      - name: Commit dos vetores de editais atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/editais_embeddings.npz
          git diff --cached --quiet || git commit -m "Atualiza vetores de editais (refresh automático diário)"
          git push
