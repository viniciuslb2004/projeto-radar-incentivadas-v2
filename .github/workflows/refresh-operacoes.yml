name: Refresh operações (BNDES + FINEP + BNB, semanal)

on:
  schedule:
    - cron: "0 6 * * 1" # toda segunda 06:00 UTC (03:00 horário de Brasília)
  workflow_dispatch: {}

# Evita duas execucoes simultaneas deste workflow (ex: o cron semanal disparando
# em cima de um "Atualizar agora" manual do painel admin) -- cancel-in-progress
# false porque um refresh a meio caminho NAO deve ser abortado (poderia deixar
# bndes_raw/finep_*_raw parcialmente atualizados); a segunda execucao so fica
# enfileirada ate a primeira terminar.
concurrency:
  group: refresh-operacoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 180min (nao 30): a 1a carga incremental do zero (backfill de ~30 mil operacoes +
    # embeddings) demorou mais que 30min mesmo rodando no Linux do GitHub -- confirmado
    # por uma execucao real cancelada no limite antigo. Depois que a base ja estiver
    # populada, os refreshes semanais seguintes processam so a diferenca e devem ser
    # bem mais rapidos -- pode reduzir esse timeout de volta assim que confirmar isso.
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar refresh incremental (BNDES + FINEP + BNB)
        working-directory: src
        run: python refresh.py

      - name: Commit dos vetores de busca atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/embeddings.npz
          git diff --cached --quiet || git commit -m "Atualiza vetores de busca (refresh automático semanal)"
          # O job inteiro roda por horas -- o master pode ter avancado (commits manuais,
          # outro workflow) entre o checkout do inicio e este push do fim. Sem o rebase,
          # o push e rejeitado (non-fast-forward) e o job falha mesmo com o refresh de
          # dados (Turso) tendo funcionado 100% -- ja aconteceu de verdade (run #3).
          git fetch origin master
          git rebase origin/master
          git push
