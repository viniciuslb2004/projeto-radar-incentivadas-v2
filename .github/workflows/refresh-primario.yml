name: Refresh Radar de Crédito Primário (CVM, diário)

on:
  schedule:
    - cron: "0 9 * * *" # todo dia 09:00 UTC (06:00 horário de Brasília) -- 1h depois do refresh de editais, mesmo secret/banco
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar refresh do Radar de Crédito Primário (CVM)
        working-directory: src
        run: python refresh_primario.py
