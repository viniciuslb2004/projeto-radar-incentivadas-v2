name: Smoke test producao

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3h
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Aguarda deploy da Vercel (so em push)
        if: github.event_name == 'push'
        run: sleep 180
      - name: Smoke test
        run: python tests/smoke_prod.py https://projeto-radar-incentivadas.vercel.app
